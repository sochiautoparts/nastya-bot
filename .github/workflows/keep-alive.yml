name: Nastya Bot — Keep Alive Watchdog 🔔🧠

on:
  schedule:
    # Check every 30 minutes — alarm clock to wake up the bot
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Qwen3-VL bot is running
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Keep-alive alarm check at $(date -u) ==="
          
          # Check for ACTIVE runs
          ACTIVE_COUNT=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=5" \
            | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              runs = [r for r in d.get('workflow_runs', []) 
                      if 'Bot' in r.get('name','') or 'Qwen3' in r.get('name','')]
              print(len(runs))
          except: print(0)
          ")
          
          # Check for QUEUED runs (don't trigger if already queued!)
          QUEUED_COUNT=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=queued&per_page=5" \
            | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              runs = [r for r in d.get('workflow_runs', []) 
                      if 'Bot' in r.get('name','') or 'Qwen3' in r.get('name','')]
              print(len(runs))
          except: print(0)
          ")
          
          echo "Active bot runs: $ACTIVE_COUNT"
          echo "Queued bot runs: $QUEUED_COUNT"
          
          # ONLY wake up if there are NO active AND NO queued runs
          if [ "$ACTIVE_COUNT" -eq 0 ] && [ "$QUEUED_COUNT" -eq 0 ]; then
            echo "Bot is NOT running! Waking up Qwen3-VL + Bot..."
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches" \
              -d '{"ref":"main"}' || true
            echo "Wake-up triggered! Bot + model will start."
          else
            echo "Bot is running ($ACTIVE_COUNT active, $QUEUED_COUNT queued). No wake-up needed."
          fi
