name: Nastya Bot 15.0 — Run Qwen3-VL + Bot 🧠🎀

on:
  workflow_dispatch:
  schedule:
    # Run every 5 hours for overlapping sessions
    - cron: '0 */5 * * *'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'miniapp/**'

concurrency:
  group: nastya-session
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # 5h45m — leaves buffer before next cron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install Ollama for LOCAL Qwen3-VL-2B model ──
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          echo "Ollama installed successfully"

      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          # Verify server is running
          for i in 1 2 3 4 5; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server is running!"
              break
            fi
            echo "Waiting for Ollama server... attempt $i"
            sleep 3
          done
          curl -s http://localhost:11434/api/tags || echo "Ollama still starting..."

      # ── Cache Ollama models (saves ~2GB download each run!) ──
      - name: Cache Ollama Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama
          key: ollama-qwen3-vl-2b-v1
          restore-keys: |
            ollama-qwen3-

      - name: Pull Qwen3-VL-2B Model
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          echo "=== Pulling Qwen3-VL-2B model (quantized, ~1.5GB) ==="
          ollama pull qwen3-vl:2b 2>&1
          echo "=== Pulling Qwen3:1.7B as fast text backup ==="
          ollama pull qwen3:1.7b 2>&1
          echo "=== All models pulled ==="

      - name: Verify Ollama Models
        run: |
          echo "=== Installed Ollama Models ==="
          ollama list
          echo ""
          echo "=== Testing qwen3-vl:2b with simple prompt ==="
          ollama run qwen3-vl:2b "Привет, ответь одним словом" --nowordwrap 2>&1 | head -5 || true
          echo "=== Model verification done ==="

      # ── Python Setup ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/nastya.db
          key: nastya-db-v15
          restore-keys: |
            nastya-db-

      # ── Run the Bot with Qwen3-VL model ──
      - name: Run Nastya Bot 15.0 (Qwen3-VL + Bot) 🧠💅
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.OWNER_ID }}
          BOT_USERNAME: asnastya_bot
          # LOCAL model — Qwen3-VL-2B via Ollama (PRIMARY!)
          OLLAMA_BASE_URL: http://localhost:11434
          # GitHub Models — reliable backup via PAT
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN_SECRET }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # Free cloud providers (no keys needed!)
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # Limited providers (optional fallbacks)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Channel
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          # Server
          DB_PATH: data/nastya.db
          LOG_LEVEL: INFO
          # News settings
          NEWS_FETCH_INTERVAL: 900
          CHANNEL_POST_INTERVAL: 1200
        run: |
          echo "=== Starting Nastya Bot 15.0 with Qwen3-VL-2B ==="
          echo "Ollama status:"
          curl -s http://localhost:11434/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); [print(f'  Model: {m[\"name\"]}') for m in d.get('models',[])]" 2>/dev/null || echo "  Ollama not responding"
          echo "=== Launching bot ==="
          python -m bot.main || true

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/nastya.db
          key: nastya-db-v15-${{ github.run_id }}

      # ── Keep-alive: trigger next session automatically ──
      - name: Wake up next session (alarm clock)
        if: always()
        run: |
          echo "=== Session ended, waking up next session ==="
          sleep 30
          # Trigger the next bot session to keep it running 24/7
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
            -d '{"ref":"main"}' || echo "Could not trigger next session (may be rate limited)"
        continue-on-error: true

  # ── Keep-alive watchdog: restart if no active session ──
  keep-alive-check:
    runs-on: ubuntu-latest
    needs: []
    if: always()
    steps:
      - name: Check if bot is running
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Keep-alive check at $(date -u) ==="
          
          ACTIVE_COUNT=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=5" \
            | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              runs = [r for r in d.get('workflow_runs', []) if 'Qwen3' in r.get('name','') or 'Bot' in r.get('name','') or 'Nastya' in r.get('name','')]
              print(len(runs))
          except:
              print(0)
          ")
          
          echo "Active bot runs: $ACTIVE_COUNT"
          
          if [ "$ACTIVE_COUNT" -eq 0 ]; then
            echo "No active bot runs! Waking up..."
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches" \
              -d '{"ref":"main"}' || true
            echo "Wake-up triggered!"
          else
            echo "Bot is running, no action needed"
          fi
