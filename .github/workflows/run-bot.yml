name: Run Nastya Bot 15.0 🎀🧠

on:
  workflow_dispatch:
  schedule:
    # Run every 5 hours for overlapping sessions
    - cron: '0 */5 * * *'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'miniapp/**'

concurrency:
  group: nastya-session
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # 5h45m — leaves buffer before next cron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install Ollama for LOCAL Qwen3-VL-2B model ──
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          echo "Ollama installed successfully"

      - name: Start Ollama Server
        run: |
          ollama serve &
          sleep 5
          # Verify server is running
          curl -s http://localhost:11434/api/tags || echo "Ollama server starting..."
          sleep 5
          curl -s http://localhost:11434/api/tags || echo "Ollama server still starting..."

      - name: Pull Qwen3-VL-2B Model
        run: |
          echo "Pulling Qwen3-VL-2B model (quantized, ~1.5GB)..."
          ollama pull qwen3-vl:2b 2>&1 || echo "qwen3-vl:2b pull failed, trying alternatives..."

          # Also pull a fast text-only model as backup
          echo "Pulling Qwen3:1.7B as fast text backup..."
          ollama pull qwen3:1.7b 2>&1 || echo "qwen3:1.7b pull failed"

          # List installed models
          echo "=== Installed Ollama Models ==="
          ollama list

      # ── Python Setup ──
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/nastya.db
          key: nastya-db-v15
          restore-keys: |
            nastya-db-

      # ── Run the Bot ──
      - name: Run Nastya Bot 15.0 💅🧠
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          BOT_USERNAME: asnastya_bot
          # LOCAL model — Ollama on localhost (PRIMARY!)
          OLLAMA_BASE_URL: http://localhost:11434
          # GitHub Models — reliable backup via PAT
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN_SECRET }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          # Free cloud providers (no keys needed!)
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          # Limited providers (optional fallbacks)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Channel
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          # Server
          DB_PATH: data/nastya.db
          LOG_LEVEL: INFO
          # News settings
          NEWS_FETCH_INTERVAL: 900
          CHANNEL_POST_INTERVAL: 1200
        run: python -m bot.main || true

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/nastya.db
          key: nastya-db-v15-${{ github.run_id }}

      - name: Trigger next session (keep-alive chain)
        if: always()
        run: |
          sleep 30
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GH_PAT_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches \
            -d '{"ref":"main"}' || true
        continue-on-error: true

  # Keep-alive watchdog: restart if no active session
  keep-alive-check:
    runs-on: ubuntu-latest
    needs: []
    if: always()
    steps:
      - name: Check if bot is running
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          ACTIVE_COUNT=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=5" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          runs = [r for r in d.get('workflow_runs', []) if '15.0' in r.get('name','') or 'Bot' in r.get('name','') or 'Настя' in r.get('name','')]
          print(len(runs))
          ")

          echo "Active bot runs: $ACTIVE_COUNT"

          if [ "$ACTIVE_COUNT" -eq 0 ]; then
            echo "No active bot runs! Triggering restart..."
            curl -s -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run-bot.yml/dispatches" \
              -d '{"ref":"main"}' || true
            echo "Restart triggered!"
          else
            echo "Bot is running, no action needed"
          fi
