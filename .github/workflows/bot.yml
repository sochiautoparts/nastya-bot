name: Nastya Bot — SPEED OPTIMIZED v26

# ═══════════════════════════════════════════════════════════════
# Nastya Bot v26.0 — SPEED OPTIMIZED (NO QWEN)
#
# Architecture:
#   - LOCAL OLLAMA as PRIMARY AI provider
#   - POLLINATIONS as FALLBACK (text + vision timeout)
#   - Models: phi4-mini:3.8b (text), moondream:2b (vision)
#   - NO QWEN — completely removed!
#   - Bot runs continuously with UNLIMITED auto-restart
#   - Every 5 hours cron kicks off a fresh runner
#   - Single concurrency group — ONE bot instance only!
#   - Health watchdog: checks Telegram + Ollama every 300s
#   - Self-dispatch: re-triggers workflow when runner time runs out
#
# v26.0 CHANGES vs v25.0:
#   - qwen3-vl:2b → moondream:2b (2-3x faster vision on CPU!)
#   - qwen3:1.7b removed — phi4-mini:3.8b is the only text model
#   - Cache key updated for moondream
#   - Vision timeout 15s → Pollinations fallback
#
# Schedule (UTC, Moscow = UTC+3):
#   Every 5 hours: 00:00, 05:00, 10:00, 15:00, 20:00
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 03:00 Moscow
    - cron: '0 5 * * *'      # 05:00 UTC = 08:00 Moscow
    - cron: '0 10 * * *'     # 10:00 UTC = 13:00 Moscow
    - cron: '0 15 * * *'     # 15:00 UTC = 18:00 Moscow
    - cron: '0 20 * * *'     # 20:00 UTC = 23:00 Moscow
  workflow_dispatch:

# ═══ CRITICAL: Single concurrency group ═══
concurrency:
  group: nastya-bot-single
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  PYTHONUNBUFFERED: "1"
  OLLAMA_BASE_URL: "http://localhost:11434"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # ~5h45m

    steps:
      # ── Kill conflicting runs ──
      - name: Cancel conflicting runs and wait
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Checking for other running bot instances ==="
          CURRENT_RUN=${{ github.run_id }}
          REPO=${{ github.repository }}

          for status in in_progress queued; do
            RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?status=$status&per_page=10" \
              | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
              for r in d.get("workflow_runs", []):
                  if r["id"] != int(sys.argv[1]):
                      print(r["id"])
          except: pass
          ' "$CURRENT_RUN")

            for run_id in $RUNS; do
              echo "Cancelling $status run: $run_id"
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel" || true
            done
          done

          echo "Waiting 60s for old bot instances to fully stop..."
          sleep 60
          echo "=== Ready to start ==="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Ollama for LOCAL model inference ──
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          # Start with keep_alive=-1 to keep model in memory permanently
          OLLAMA_KEEP_ALIVE=-1 ollama serve &
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server is ready!"
              break
            fi
            echo "Waiting for Ollama... ($i/30)"
            sleep 2
          done

      - name: Cache Ollama Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama
          key: ollama-phi4-moondream-v1
          restore-keys: |
            ollama-phi4-
            ollama-moondream-

      - name: Pull models
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          echo "=== Pulling Phi4-Mini-3.8B (PRIMARY text model — fast, smart) ==="
          ollama pull phi4-mini:3.8b
          echo "=== Pulling Moondream-2B (vision model — 2-3x faster than qwen3-vl!) ==="
          ollama pull moondream:2b

      - name: Verify Ollama and models
        run: |
          echo "=== Installed models ==="
          ollama list
          echo ""
          echo "=== Quick test: Phi4-Mini-3.8B (PRIMARY text model) ==="
          curl -s http://localhost:11434/api/chat -d '{
            "model": "phi4-mini:3.8b",
            "messages": [{"role": "user", "content": "Привет! Скажи что-нибудь."}],
            "stream": false,
            "options": {"num_predict": 20}
          }' | python3 -m json.tool || true
          echo ""
          echo "=== Quick test: Moondream-2B (vision model — MUCH faster than qwen3-vl!) ==="
          curl -s http://localhost:11434/api/chat -d '{
            "model": "moondream:2b",
            "messages": [{"role": "user", "content": "Привет! Скажи что-нибудь."}],
            "stream": false,
            "options": {"num_predict": 20}
          }' | python3 -m json.tool || true

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/nastya.db
          key: nastya-db-v26
          restore-keys: |
            nastya-db-

      # ── Run the Bot — UNLIMITED AUTO-RESTART ──
      - name: Run Nastya Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.OWNER_ID }}
          BOT_USERNAME: asnastya_bot
          OLLAMA_BASE_URL: http://localhost:11434
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          DB_PATH: data/nastya.db
          LOG_LEVEL: INFO
          NEWS_FETCH_INTERVAL: 900
          CHANNEL_POST_INTERVAL: 1200
          OLLAMA_KEEP_ALIVE: -1
          OLLAMA_VISION_TIMEOUT: 15
        run: |
          echo "=== Starting Nastya Bot 26.0 (SPEED OPTIMIZED — phi4-mini + moondream + Pollinations) ==="
          echo "Ollama status:"
          curl -s http://localhost:11434/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); [print(f'  Model: {m[\"name\"]}') for m in d.get('models',[])]" 2>/dev/null || echo "  Ollama not responding"
          echo "=== Launching bot with UNLIMITED auto-restart ==="

          # UNLIMITED retries — bot MUST always be running!
          RETRY=0
          while true; do
            RETRY=$((RETRY+1))
            echo "--- Attempt $RETRY ---"

            # Check Ollama before starting bot
            if ! curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "WARNING: Ollama not responding! Trying to restart..."
              pkill ollama 2>/dev/null || true
              sleep 3
              OLLAMA_KEEP_ALIVE=-1 ollama serve &
              sleep 15
              if ! curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
                echo "CRITICAL: Ollama still not responding after restart!"
                sleep 30
                continue
              fi
              echo "Ollama restarted successfully!"
            fi

            python3 -m bot.main
            EXIT_CODE=$?
            echo "Bot exited with code $EXIT_CODE (attempt $RETRY)"

            # Intelligent backoff based on exit code
            if [ $EXIT_CODE -eq 2 ]; then
              echo "Persistent conflicts — restarting in 10s..."
              sleep 10
            elif [ $EXIT_CODE -eq 3 ]; then
              echo "Health check failure — restarting Ollama + bot in 20s..."
              pkill ollama 2>/dev/null || true
              sleep 5
              OLLAMA_KEEP_ALIVE=-1 ollama serve &
              sleep 15
            elif [ $EXIT_CODE -eq 0 ]; then
              echo "Session timeout — restarting in 5s..."
              sleep 5
            else
              if [ $RETRY -le 3 ]; then
                SLEEP=10
              elif [ $RETRY -le 6 ]; then
                SLEEP=15
              else
                SLEEP=30
              fi
              echo "Bot crashed (code $EXIT_CODE) — restarting in ${SLEEP}s..."
              sleep $SLEEP
            fi
          done

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/nastya.db
          key: nastya-db-v26-${{ github.run_id }}

      # ── Self-dispatch for 24/7 ──
      - name: Re-dispatch workflow for continuous operation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Re-dispatching workflow for 24/7 uptime ==="
          REPO=${{ github.repository }}
          sleep 10
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "Workflow re-dispatched successfully (attempt $i)"
              break
            fi
            echo "Re-dispatch attempt $i failed (HTTP $HTTP_CODE), retrying in 10s..."
            sleep 10
          done
          echo "=== Re-dispatch complete ==="

      - name: Cleanup
        if: always()
        run: |
          echo "=== Bot session ended ==="
          pkill ollama || true
