name: Nastya Bot — Qwen3-VL-2B via Ollama

# ═══════════════════════════════════════════════════════════════
# Nastya Bot 24/7 Runner
#
# Architecture:
#   - Ollama runs INSIDE GitHub Actions with Qwen3-VL-2B model
#   - Bot wakes up on schedule (cron alarm), runs for ~5.5 hours
#   - Multiple daily shifts ensure near-24/7 coverage
#   - If one run fails, the next shift picks up automatically
#   - Model is cached between runs for fast startup
#
# Schedule (UTC, Moscow = UTC+3):
#   Shift 1: 00:00 UTC (03:00 Moscow) — morning shift
#   Shift 2: 06:00 UTC (09:00 Moscow) — day shift
#   Shift 3: 12:00 UTC (15:00 Moscow) — afternoon shift
#   Shift 4: 18:00 UTC (21:00 Moscow) — evening shift
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    # 4 shifts per day, every 6 hours — ensures 24/7 coverage
    - cron: '0 0 * * *'    # 00:00 UTC = 03:00 Moscow
    - cron: '0 6 * * *'    # 06:00 UTC = 09:00 Moscow
    - cron: '0 12 * * *'   # 12:00 UTC = 15:00 Moscow
    - cron: '0 18 * * *'   # 18:00 UTC = 21:00 Moscow
  workflow_dispatch:        # Manual trigger for testing

concurrency:
  group: nastya-bot-single
  cancel-in-progress: true  # Kill previous run if still going

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OLLAMA_BASE_URL: "http://localhost:11434"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # ~5.8 hours max per shift

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          # Wait for Ollama to be ready
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server is ready!"
              break
            fi
            echo "Waiting for Ollama... ($i/30)"
            sleep 2
          done

      - name: Pull Qwen3-VL-2B model
        run: |
          echo "=== Pulling Qwen3-VL-2B model ==="
          ollama pull qwen3-vl:2b
          echo "=== Also pulling Qwen3-1.7B for fast responses ==="
          ollama pull qwen3:1.7b || true
          echo "=== Installed models ==="
          ollama list

      - name: Verify Ollama and models
        run: |
          echo "=== Ollama status ==="
          curl -s http://localhost:11434/api/tags | python3 -m json.tool || true
          echo ""
          echo "=== Quick test: Qwen3-VL-2B ==="
          curl -s http://localhost:11434/api/chat -d '{
            "model": "qwen3-vl:2b",
            "messages": [{"role": "user", "content": "Привет! Скажи что-нибудь."}],
            "stream": false,
            "options": {"num_predict": 20}
          }' | python3 -m json.tool || true

      - name: Run Nastya Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OLLAMA_BASE_URL: "http://localhost:11434"
          DB_PATH: "data/nastya.db"
          LOG_LEVEL: "INFO"
        run: |
          echo "=== Starting Nastya Bot 15.1 with Qwen3-VL-2B ==="
          echo "Ollama status:"
          curl -s http://localhost:11434/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); print('  Models:', [m['name'] for m in d.get('models',[])])" || echo "  Ollama not responding"
          echo "=== Launching bot ==="
          python3 -m bot.main

      - name: Bot shutdown cleanup
        if: always()
        run: |
          echo "=== Bot session ended ==="
          # Kill Ollama if still running
          pkill ollama || true
