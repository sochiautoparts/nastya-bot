name: Nastya Bot — LOCAL-FIRST v66 + Local-Only Posting

# ═══════════════════════════════════════════════════════════════
# Nastya Bot v66.0 — LOCAL-FIRST Qwen3-4B + CLOUD FAILOVER + LOCAL-ONLY POSTING
#
#   - LOCAL MODEL: Qwen3-4B Q4_K_M (~2.5GB GGUF, CPU inference)
#   - LOCAL-FIRST for chat/comments (saves cloud balance!)
#   - CLOUD-FIRST for function routes (posts, VIN, consultations)
#   - LOCAL-ONLY POSTING fallback when all cloud providers are down
#   - 6-LEVEL FAILOVER: Local -> Pollinations(key) -> Pollinations(free) -> Cloudflare -> Local(fallback) -> Local-Only -> Static
#   - Model caching via actions/cache@v4
#   - HF_TOKEN for authenticated HuggingFace download (gated model)
#   - libopenblas-dev for fast CPU inference via llama-cpp-python
#   - Pollinations.ai (44+ models, weighted round-robin) — ALL routes
#   - DUAL API KEY FAILOVER: KEY1 → KEY2 → static fallback
#   - pyswisseph for accurate planetary positions
#
# Schedule (UTC, Moscow = UTC+3):
#   Every 5 hours: 00:00, 05:00, 10:00, 15:00, 20:00
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 03:00 Moscow
    - cron: '0 5 * * *'      # 05:00 UTC = 08:00 Moscow
    - cron: '0 10 * * *'     # 10:00 UTC = 13:00 Moscow
    - cron: '0 15 * * *'     # 15:00 UTC = 18:00 Moscow
    - cron: '0 20 * * *'     # 20:00 UTC = 23:00 Moscow
  workflow_dispatch:

# ═══ CRITICAL: Single concurrency group ═══
concurrency:
  group: nastya-bot-single
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # ~5h45m

    steps:
      # ── Kill conflicting runs ──
      - name: Cancel conflicting runs and wait
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Checking for other running bot instances ==="
          CURRENT_RUN=${{ github.run_id }}
          REPO=${{ github.repository }}

          for status in in_progress queued; do
            RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?status=$status&per_page=10" \
              | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
              for r in d.get("workflow_runs", []):
                  if r["id"] != int(sys.argv[1]):
                      print(r["id"])
          except: pass
          ' "$CURRENT_RUN")

            for run_id in $RUNS; do
              echo "Cancelling $status run: $run_id"
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel" || true
            done
          done

          echo "Waiting 60s for old bot instances to fully stop..."
          sleep 60
          echo "=== Ready to start ==="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # Install system dependencies for llama-cpp-python (OpenBLAS for fast CPU inference)
          sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev
          # Install llama-cpp-python with CPU optimizations (OpenBLAS for fast inference)
          CMAKE_ARGS="-DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS" pip install llama-cpp-python>=0.3.0 --no-cache-dir
          # Install remaining dependencies
          pip install -r requirements.txt

      - name: Clean Python cache
        run: |
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name "*.pyc" -delete 2>/dev/null || true
          echo "Python cache cleaned"

      - name: Create data directory
        run: mkdir -p data models

      - name: Download Admitad partner data
        run: |
          mkdir -p data
          curl -sL "https://raw.githubusercontent.com/creastudioai-beep/pr/main/data/admitad_ads.json" \
            -o data/admitad_ads.json || echo "Failed to download admitad data, will use cached version"

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/nastya.db
          key: nastya-db-v66
          restore-keys: |
            nastya-db-

      - name: Cache local model
        uses: actions/cache@v4
        with:
          path: models/Qwen3-4B-Q4_K_M.gguf
          key: qwen3-4b-q4km-nastya-v1
          restore-keys: |
            qwen3-4b-q4km-

      - name: Download local model (if not cached)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p models
          if [ -f "models/Qwen3-4B-Q4_K_M.gguf" ]; then
            SIZE=$(stat -c%s "models/Qwen3-4B-Q4_K_M.gguf" 2>/dev/null || echo 0)
            SIZE_MB=$((SIZE / 1048576))
            echo "Model file found in cache: ${SIZE_MB} MB"
            if [ "$SIZE_MB" -lt 100 ]; then
              echo "Cached file too small, removing..."
              rm -f models/Qwen3-4B-Q4_K_M.gguf
            fi
          fi

          if [ ! -f "models/Qwen3-4B-Q4_K_M.gguf" ]; then
            echo "Downloading Qwen3-4B Q4_K_M (~2.3GB)..."
            if [ -n "$HF_TOKEN" ]; then
              echo "Using HF_TOKEN for authenticated download"
              pip install -q huggingface_hub
              huggingface-cli download Qwen/Qwen3-4B-GGUF Qwen3-4B-Q4_K_M.gguf --local-dir models --token "$HF_TOKEN" || {
                echo "HF hub download failed, trying direct URL..."
                curl -L --retry 3 --max-time 600 \
                  -H "Authorization: Bearer $HF_TOKEN" \
                  -o models/Qwen3-4B-Q4_K_M.gguf \
                  "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf" || {
                  echo "Authenticated download failed, trying unauthenticated..."
                  curl -L --retry 3 --max-time 600 \
                    -o models/Qwen3-4B-Q4_K_M.gguf \
                    "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf" || true
                }
              }
            else
              echo "No HF_TOKEN set, trying unauthenticated download..."
              curl -L --retry 3 --max-time 600 \
                -o models/Qwen3-4B-Q4_K_M.gguf \
                "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf" || true
            fi
          fi

          # Verify model file
          if [ -f "models/Qwen3-4B-Q4_K_M.gguf" ]; then
            SIZE=$(stat -c%s "models/Qwen3-4B-Q4_K_M.gguf" 2>/dev/null || echo 0)
            SIZE_MB=$((SIZE / 1048576))
            echo "Model file: ${SIZE_MB} MB"
            if [ "$SIZE_MB" -lt 100 ]; then
              echo "ERROR: Model file too small (${SIZE_MB} MB), likely corrupted!"
              rm -f models/Qwen3-4B-Q4_K_M.gguf
              echo "ENABLE_LOCAL_MODEL=false" >> $GITHUB_ENV
            else
              echo "Model downloaded successfully!"
            fi
          else
            echo "WARNING: Model download failed, running in cloud-only mode"
            echo "ENABLE_LOCAL_MODEL=false" >> $GITHUB_ENV
          fi

      - name: Ensure .gitignore allows database
        run: |
          if [ -f .gitignore ]; then
            sed -i '/nastya\.db/d' .gitignore
          fi

      # ── Run the Bot — UNLIMITED AUTO-RESTART ──
      - name: Run Nastya Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.OWNER_ID }}
          BOT_USERNAME: asnastya_bot
          # Pollinations.ai — DUAL KEY FAILOVER
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_API_KEY_2: ${{ secrets.POLLINATIONS_API_KEY_2 }}
          # Cloudflare Workers AI — FALLBACK (Mistral Small 3.1, dual-account)
          CF_ACCOUNT_ID_1: ${{ secrets.CF_ACCOUNT_ID_1 }}
          CF_TOKEN_1: ${{ secrets.CF_TOKEN_1 }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_TOKEN_2: ${{ secrets.CF_TOKEN_2 }}
          # Local model — ENABLED (Qwen3-4B Q4_K_M, ~2.5GB)
          ENABLE_LOCAL_MODEL: ${{ env.ENABLE_LOCAL_MODEL || 'true' }}
          MODEL_PATH: "models/Qwen3-4B-Q4_K_M.gguf"
          MODEL_N_CTX: "4096"
          MODEL_N_THREADS: "2"
          MODEL_MAX_TOKENS: "1024"
          MODEL_AUTO_DOWNLOAD: "true"
          MODEL_DOWNLOAD_URL: "https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/Qwen3-4B-Q4_K_M.gguf"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          DB_PATH: data/nastya.db
          LOG_LEVEL: INFO
          NEWS_FETCH_INTERVAL: 900
          CHANNEL_POST_INTERVAL: 1200
        run: |
          echo "=== Starting Nastya Bot v66.0 LOCAL-FIRST + LOCAL-ONLY POSTING ==="
          echo "LOCAL MODEL: Qwen3-4B Q4_K_M (PRIMARY for chat/comments, FALLBACK for posts)"
          echo "CLOUD: Pollinations (44+ models, dual-key) + Cloudflare (mistral-small-3.1)"
          echo "STRATEGY: LOCAL-first (chat/comments) / CLOUD-first (functions) / LOCAL-ONLY (last resort posts)"
          echo "FAILOVER: Local -> Pollinations(key) -> Pollinations(free) -> Cloudflare -> Local(fallback) -> Local-Only -> Static"
          echo "=== Launching bot with UNLIMITED auto-restart ==="

          # UNLIMITED retries — bot MUST always be running!
          RETRY=0
          while true; do
            RETRY=$((RETRY+1))
            echo "--- Attempt $RETRY ---"

            python3 -m bot.main
            EXIT_CODE=$?
            echo "Bot exited with code $EXIT_CODE (attempt $RETRY)"

            # Intelligent backoff based on exit code
            if [ $EXIT_CODE -eq 2 ]; then
              echo "Persistent conflicts — restarting in 10s..."
              sleep 10
            elif [ $EXIT_CODE -eq 3 ]; then
              echo "Health check failure — restarting in 20s..."
              sleep 20
            elif [ $EXIT_CODE -eq 0 ]; then
              echo "Session timeout — restarting in 5s..."
              sleep 5
            else
              if [ $RETRY -le 3 ]; then
                SLEEP=10
              elif [ $RETRY -le 6 ]; then
                SLEEP=15
              else
                SLEEP=30
              fi
              echo "Bot crashed (code $EXIT_CODE) — restarting in ${SLEEP}s..."
              sleep $SLEEP
            fi
          done

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/nastya.db
          key: nastya-db-v66-${{ github.run_id }}

      - name: Save database to git
        if: always()
        run: |
          if [ -f data/nastya.db ]; then
            git config user.name "Nastya Bot"
            git config user.email "nastya-bot@users.noreply.github.com"
            git add -f data/nastya.db || true
            git diff --staged --quiet || git commit -m "db: update $(date +%Y-%m-%d_%H:%M)" || true
            git pull --rebase origin main || true
            git push || true
          fi

      # ── Self-dispatch for 24/7 ──
      - name: Re-dispatch workflow for continuous operation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Re-dispatching workflow for 24/7 uptime ==="
          REPO=${{ github.repository }}
          sleep 10
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "Workflow re-dispatched successfully (attempt $i)"
              break
            fi
            echo "Re-dispatch attempt $i failed (HTTP $HTTP_CODE), retrying in 10s..."
            sleep 10
          done
          echo "=== Re-dispatch complete ==="

      - name: Cleanup
        if: always()
        run: |
          echo "=== Bot session ended ==="
