name: Nastya Bot — Qwen3-VL-2B

# ═══════════════════════════════════════════════════════════════
# SINGLE CONSOLIDATED WORKFLOW for Nastya Bot
#
# Architecture:
#   - Ollama runs INSIDE GitHub Actions with Qwen3-VL-2B model
#   - Bot wakes up on schedule (cron alarm), runs for ~5.5 hours
#   - Multiple daily shifts ensure near-24/7 coverage
#   - concurrency: ONLY ONE instance can run at a time!
#   - If old run is still going, it gets cancelled automatically
#   - This PREVENTS TelegramConflictError from multiple instances
#
# Schedule (UTC, Moscow = UTC+3):
#   Shift 1: 00:00 UTC (03:00 Moscow)
#   Shift 2: 05:30 UTC (08:30 Moscow)
#   Shift 3: 11:00 UTC (14:00 Moscow)
#   Shift 4: 16:30 UTC (19:30 Moscow)
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 03:00 Moscow
    - cron: '30 5 * * *'     # 05:30 UTC = 08:30 Moscow
    - cron: '0 11 * * *'     # 11:00 UTC = 14:00 Moscow
    - cron: '30 16 * * *'    # 16:30 UTC = 19:30 Moscow
  workflow_dispatch:

# ═══ CRITICAL: Single concurrency group — prevents multiple instances! ═══
concurrency:
  group: nastya-bot
  cancel-in-progress: true  # Always kill previous run — ONE bot only!

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OLLAMA_BASE_URL: "http://localhost:11434"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # ~5h45m — leaves buffer before next cron

    steps:
      # ── Kill ANY other running bot instances FIRST ──
      - name: Cancel conflicting runs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Checking for other running bot instances ==="
          CURRENT_RUN=${{ github.run_id }}
          
          # Get all in-progress runs for this repo
          RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=10" \
            | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              for r in d.get('workflow_runs', []):
                  if r['id'] != $CURRENT_RUN:
                      print(r['id'])
          except: pass
          ")
          
          for run_id in $RUNS; do
            echo "Cancelling conflicting run: $run_id"
            curl -s -X POST -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id/cancel" || true
          done
          
          if [ -n "$RUNS" ]; then
            echo "Waiting 10s for cancellations to take effect..."
            sleep 10
          fi
          echo "=== Ready to start ==="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Ollama for LOCAL Qwen3-VL-2B model ──
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server is ready!"
              break
            fi
            echo "Waiting for Ollama... ($i/30)"
            sleep 2
          done

      - name: Cache Ollama Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama
          key: ollama-qwen3-vl-2b-v3
          restore-keys: |
            ollama-qwen3-

      - name: Pull Qwen3-VL-2B model
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          echo "=== Pulling Qwen3-VL-2B model ==="
          ollama pull qwen3-vl:2b
          echo "=== Pulling Qwen3-1.7B for fast responses ==="
          ollama pull qwen3:1.7b || true

      - name: Verify Ollama and models
        run: |
          echo "=== Installed models ==="
          ollama list
          echo ""
          echo "=== Quick test: Qwen3-VL-2B ==="
          curl -s http://localhost:11434/api/chat -d '{
            "model": "qwen3-vl:2b",
            "messages": [{"role": "user", "content": "Привет! Скажи что-нибудь."}],
            "stream": false,
            "options": {"num_predict": 20}
          }' | python3 -m json.tool || true

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/nastya.db
          key: nastya-db-v16
          restore-keys: |
            nastya-db-

      # ── Run the Bot ──
      - name: Run Nastya Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.OWNER_ID }}
          BOT_USERNAME: asnastya_bot
          OLLAMA_BASE_URL: http://localhost:11434
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN_SECRET }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          DB_PATH: data/nastya.db
          LOG_LEVEL: INFO
          NEWS_FETCH_INTERVAL: 900
          CHANNEL_POST_INTERVAL: 1200
        run: |
          echo "=== Starting Nastya Bot 15.1 with Qwen3-VL-2B ==="
          echo "Ollama status:"
          curl -s http://localhost:11434/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); [print(f'  Model: {m[\"name\"]}') for m in d.get('models',[])]" 2>/dev/null || echo "  Ollama not responding"
          echo "=== Launching bot ==="
          python3 -m bot.main || true

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/nastya.db
          key: nastya-db-v16-${{ github.run_id }}

      # ── Auto-restart: trigger next session if bot stopped ──
      - name: Wake up next session
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Session ended, checking if restart needed ==="
          sleep 15
          
          ACTIVE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=5" \
            | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              runs = [r for r in d.get('workflow_runs', []) if 'Bot' in r.get('name','') or 'Qwen3' in r.get('name','')]
              print(len(runs))
          except: print(0)
          ")
          
          QUEUED=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=queued&per_page=5" \
            | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              runs = [r for r in d.get('workflow_runs', []) if 'Bot' in r.get('name','') or 'Qwen3' in r.get('name','')]
              print(len(runs))
          except: print(0)
          ")
          
          echo "Active: $ACTIVE, Queued: $QUEUED"
          
          if [ "$ACTIVE" -eq 0 ] && [ "$QUEUED" -eq 0 ]; then
            echo "No other sessions — triggering restart..."
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main"}' || echo "Restart trigger failed"
          else
            echo "Other sessions exist — no restart needed"
          fi
        continue-on-error: true

      - name: Cleanup
        if: always()
        run: |
          echo "=== Bot session ended ==="
          pkill ollama || true
