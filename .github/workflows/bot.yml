name: Nastya Bot — DUAL-KEY SMART ROUTING v60

# ═══════════════════════════════════════════════════════════════
# Nastya Bot v60.0 — DUAL-KEY SMART ROUTING
#
#   - LlamaCpp Qwen3-4B (n_ctx=4096, n_batch=512) — LOCAL for chat & comments
#   - Pollinations.ai (44 chat models) — CLOUD-FIRST for posts & functions
#   - DUAL API KEY FAILOVER: KEY1 → KEY2 → local fallback
#   - SMART ROUTING:
#     - Chat (normal conversation) → LOCAL-FIRST (saves balance!)
#     - Posts & functions → CLOUD-FIRST (better quality for public content!)
#     - Comments in groups → LOCAL-ONLY (no cloud waste on casual comments!)
#   - Vision (photos) → CLOUD model only
#   - Background (news, channel) → CLOUD-FIRST for quality posts!
#   - IMAGE GENERATION — Настя РИСУЕТ! 🎨 (flux model)
#   - Persona: Настя — москвичка, владеет BMW M3 2025!
#   - INLINE MODE — Настя работает в любом чате!
#
# LOCAL MODEL (Qwen3-4B, n_ctx=4096, n_batch=512):
#   - ENABLED — PRIMARY for simple chat & comments
#   - max_tokens=300, timeout=45s — fast generation!
#   - 4 history msgs, 600ch system prompt — tight & fast
#
# NO TESTS — bot starts immediately!
#
# Schedule (UTC, Moscow = UTC+3):
#   Every 5 hours: 00:00, 05:00, 10:00, 15:00, 20:00
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 03:00 Moscow
    - cron: '0 5 * * *'      # 05:00 UTC = 08:00 Moscow
    - cron: '0 10 * * *'     # 10:00 UTC = 13:00 Moscow
    - cron: '0 15 * * *'     # 15:00 UTC = 18:00 Moscow
    - cron: '0 20 * * *'     # 20:00 UTC = 23:00 Moscow
  workflow_dispatch:

# ═══ CRITICAL: Single concurrency group ═══
concurrency:
  group: nastya-bot-single
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # ~5h45m

    steps:
      # ── Kill conflicting runs ──
      - name: Cancel conflicting runs and wait
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Checking for other running bot instances ==="
          CURRENT_RUN=${{ github.run_id }}
          REPO=${{ github.repository }}

          for status in in_progress queued; do
            RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?status=$status&per_page=10" \
              | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
              for r in d.get("workflow_runs", []):
                  if r["id"] != int(sys.argv[1]):
                      print(r["id"])
          except: pass
          ' "$CURRENT_RUN")

            for run_id in $RUNS; do
              echo "Cancelling $status run: $run_id"
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel" || true
            done
          done

          echo "Waiting 60s for old bot instances to fully stop..."
          sleep 60
          echo "=== Ready to start ==="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ═══════════════════════════════════════════════════════════
      #  LOCAL MODEL — Qwen3-4B as FALLBACK when cloud is unavailable
      # ═══════════════════════════════════════════════════════════

      - name: Install llama-cpp-python with AVX2
        run: |
          echo "=== Installing llama-cpp-python with AVX2 support ==="
          CMAKE_ARGS="-DGGML_AVX2=on" pip install llama-cpp-python --force-reinstall --no-cache-dir 2>&1 || {
            echo "WARNING: AVX2 build failed, trying without..."
            pip install llama-cpp-python --force-reinstall --no-cache-dir
          }
          python3 -c "from llama_cpp import Llama; print('llama-cpp-python OK!')" || {
            echo "WARNING: llama-cpp-python import failed — running CLOUD-ONLY"
          }
          pip install huggingface_hub

      - name: Cache LOCAL FALLBACK model (Qwen3-4B)
        id: cache-model
        uses: actions/cache@v4
        with:
          path: models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          key: qwen3-4b-instruct-q4km-v3

      - name: Download Qwen3-4B-Instruct GGUF model
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          echo "=== Downloading Qwen3-4B-Instruct Q4_K_M model (~2.4GB) — LOCAL FALLBACK ==="
          mkdir -p models
          python3 -c "
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id='unsloth/Qwen3-4B-Instruct-2507-GGUF',
              filename='Qwen3-4B-Instruct-2507-Q4_K_M.gguf',
              local_dir='models',
          )
          print('Downloaded to:', path)
          " || echo "WARNING: Model download failed — running CLOUD-ONLY"

      - name: Verify model
        run: |
          echo "=== Verifying GGUF model ==="
          MODEL_FILE=models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          if [ ! -f "$MODEL_FILE" ] || [ ! -s "$MODEL_FILE" ]; then
            echo "WARNING: Model file missing or empty — running in CLOUD-ONLY mode"
          else
            MODEL_SIZE=$(du -h "$MODEL_FILE" | cut -f1)
            echo "OK: Qwen3-4B-Instruct-Q4_K_M (${MODEL_SIZE}) — LOCAL FALLBACK"
          fi

      - name: Create data directory
        run: mkdir -p data

      - name: Download Admitad partner data
        run: |
          mkdir -p data
          curl -sL "https://raw.githubusercontent.com/creastudioai-beep/pr/main/data/admitad_ads.json" \
            -o data/admitad_ads.json || echo "Failed to download admitad data, will use cached version"

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/nastya.db
          key: nastya-db-v60
          restore-keys: |
            nastya-db-

      # ── Run the Bot — UNLIMITED AUTO-RESTART ──
      - name: Run Nastya Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.OWNER_ID }}
          BOT_USERNAME: asnastya_bot
          # Pollinations.ai — MULTI-MODEL PRIMARY + VISION + DUAL KEY
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_API_KEY_2: ${{ secrets.POLLINATIONS_API_KEY_2 }}
          # Local model — enabled as FALLBACK when cloud unavailable
          ENABLE_LOCAL_MODEL: "true"
          MODEL_PATH: models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          MODEL_N_CTX: 4096
          MODEL_N_THREADS: 4
          MODEL_MAX_TOKENS: 300
          MODEL_HISTORY_LIMIT: 4
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          DB_PATH: data/nastya.db
          LOG_LEVEL: INFO
          NEWS_FETCH_INTERVAL: 900
          CHANNEL_POST_INTERVAL: 1200
        run: |
          echo "=== Starting Nastya Bot v60.0 DUAL-KEY SMART ROUTING ==="
          echo "CHAT: LOCAL-FIRST — Local → Cloud → Fallback (saves balance!)"
          echo "POSTS/FUNCTIONS: CLOUD-FIRST — Cloud → Local → Fallback (better quality!)"
          echo "COMMENTS: LOCAL-ONLY — Local → Static fallback (no cloud waste!)"
          echo "VISION: Pollinations vision (16 models) for photos"
          echo "BACKGROUND: CLOUD-FIRST for quality posts!"
          echo "STRATEGY: chat→LOCAL_FIRST, function→CLOUD_FIRST, comment→LOCAL_ONLY, dual-key→KEY1+KEY2"
          echo "PERSONA: Настя — москвичка, владеет BMW M3 2025!"
          echo "INLINE: @asnastya_bot works in any chat!"
          echo "SEARCH: /find — товары и лучшие цены! /search — поиск информации!"

          echo "SMART ROUTING: ENABLED — Local for chat/comments, Cloud for posts/functions!"
          echo "Config: strategy=DUAL_KEY_SMART_ROUTING, n_ctx=4096, n_batch=512, max_tokens=300(local)/2000(cloud), history=4, timeout=45s, vision=cloud_only, background=cloud_first, comment=local_only, dual_key=KEY1+KEY2"
          echo "=== Launching bot with UNLIMITED auto-restart ==="

          # UNLIMITED retries — bot MUST always be running!
          RETRY=0
          while true; do
            RETRY=$((RETRY+1))
            echo "--- Attempt $RETRY ---"

            python3 -m bot.main
            EXIT_CODE=$?
            echo "Bot exited with code $EXIT_CODE (attempt $RETRY)"

            # Intelligent backoff based on exit code
            if [ $EXIT_CODE -eq 2 ]; then
              echo "Persistent conflicts — restarting in 10s..."
              sleep 10
            elif [ $EXIT_CODE -eq 3 ]; then
              echo "Health check failure — restarting in 20s..."
              sleep 20
            elif [ $EXIT_CODE -eq 0 ]; then
              echo "Session timeout — restarting in 5s..."
              sleep 5
            else
              if [ $RETRY -le 3 ]; then
                SLEEP=10
              elif [ $RETRY -le 6 ]; then
                SLEEP=15
              else
                SLEEP=30
              fi
              echo "Bot crashed (code $EXIT_CODE) — restarting in ${SLEEP}s..."
              sleep $SLEEP
            fi
          done

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/nastya.db
          key: nastya-db-v60-${{ github.run_id }}

      # ── Self-dispatch for 24/7 ──
      - name: Re-dispatch workflow for continuous operation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Re-dispatching workflow for 24/7 uptime ==="
          REPO=${{ github.repository }}
          sleep 10
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "Workflow re-dispatched successfully (attempt $i)"
              break
            fi
            echo "Re-dispatch attempt $i failed (HTTP $HTTP_CODE), retrying in 10s..."
            sleep 10
          done
          echo "=== Re-dispatch complete ==="

      - name: Cleanup
        if: always()
        run: |
          echo "=== Bot session ended ==="
