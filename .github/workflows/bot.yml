name: Nastya Bot — Qwen3-VL-2B

# ═══════════════════════════════════════════════════════════════
# SINGLE CONSOLIDATED WORKFLOW for Nastya Bot v17.0
#
# Architecture:
#   - Ollama runs INSIDE GitHub Actions with Qwen3-VL-2B model
#   - Bot runs continuously with self-restart on failure
#   - Every 5 hours cron kicks off a fresh runner (new IP, clean state)
#   - concurrency: ONLY ONE instance can run at a time!
#   - If old run is still going, it gets cancelled automatically
#   - This PREVENTS TelegramConflictError from multiple instances
#   - Auto-restart: if bot crashes, it retries up to 5 times
#
# Schedule (UTC, Moscow = UTC+3):
#   Every 5 hours: 00:00, 05:00, 10:00, 15:00, 20:00
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 03:00 Moscow
    - cron: '0 5 * * *'      # 05:00 UTC = 08:00 Moscow
    - cron: '0 10 * * *'     # 10:00 UTC = 13:00 Moscow
    - cron: '0 15 * * *'     # 15:00 UTC = 18:00 Moscow
    - cron: '0 20 * * *'     # 20:00 UTC = 23:00 Moscow
  workflow_dispatch:

# ═══ CRITICAL: Single concurrency group — prevents multiple instances! ═══
concurrency:
  group: nastya-bot-single
  cancel-in-progress: true  # Always kill previous run — ONE bot only!

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OLLAMA_BASE_URL: "http://localhost:11434"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # ~5h45m — leaves buffer before next cron

    steps:
      # ── Kill ANY other running bot instances FIRST ──
      - name: Cancel conflicting runs and wait
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Checking for other running bot instances ==="
          CURRENT_RUN=${{ github.run_id }}
          REPO=${{ github.repository }}
          
          # Get all in-progress runs for this repo and cancel them
          for status in in_progress queued; do
            RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?status=$status&per_page=10" \
              | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
              for r in d.get("workflow_runs", []):
                  if r["id"] != int(sys.argv[1]):
                      print(r["id"])
          except: pass
          ' "$CURRENT_RUN")
            
            for run_id in $RUNS; do
              echo "Cancelling $status run: $run_id"
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel" || true
            done
          done
          
          # Wait for old bot process to actually die
          # The old Python process needs time to receive SIGTERM and shut down
          echo "Waiting 30s for old bot instances to fully stop..."
          sleep 30
          echo "=== Ready to start ==="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Ollama for LOCAL Qwen3-VL-2B model ──
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama server is ready!"
              break
            fi
            echo "Waiting for Ollama... ($i/30)"
            sleep 2
          done

      - name: Cache Ollama Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: /home/runner/.ollama
          key: ollama-qwen3-vl-2b-v3
          restore-keys: |
            ollama-qwen3-

      - name: Pull Qwen3-VL-2B model
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          echo "=== Pulling Qwen3-VL-2B model ==="
          ollama pull qwen3-vl:2b
          echo "=== Pulling Qwen3-1.7B for fast responses ==="
          ollama pull qwen3:1.7b || true

      - name: Verify Ollama and models
        run: |
          echo "=== Installed models ==="
          ollama list
          echo ""
          echo "=== Quick test: Qwen3-VL-2B ==="
          curl -s http://localhost:11434/api/chat -d '{
            "model": "qwen3-vl:2b",
            "messages": [{"role": "user", "content": "Привет! Скажи что-нибудь."}],
            "stream": false,
            "options": {"num_predict": 20}
          }' | python3 -m json.tool || true

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/nastya.db
          key: nastya-db-v16
          restore-keys: |
            nastya-db-

      # ── Run the Bot ──
      - name: Run Nastya Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.OWNER_ID }}
          BOT_USERNAME: asnastya_bot
          OLLAMA_BASE_URL: http://localhost:11434
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GH_TOKEN_SECRET: ${{ secrets.GH_TOKEN_SECRET }}
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          DB_PATH: data/nastya.db
          LOG_LEVEL: INFO
          NEWS_FETCH_INTERVAL: 900
          CHANNEL_POST_INTERVAL: 1200
          OLLAMA_KEEP_ALIVE: 30m
        run: |
          echo "=== Starting Nastya Bot 17.0 with Qwen3-VL-2B ==="
          echo "Ollama status:"
          curl -s http://localhost:11434/api/tags | python3 -c "import sys,json; d=json.load(sys.stdin); [print(f'  Model: {m[\"name\"]}') for m in d.get('models',[])]" 2>/dev/null || echo "  Ollama not responding"
          echo "=== Launching bot with auto-restart ==="
          # Auto-restart: if bot crashes, retry up to 5 times
          RETRY=0
          MAX_RETRIES=5
          while [ $RETRY -lt $MAX_RETRIES ]; do
            echo "--- Attempt $((RETRY+1))/$MAX_RETRIES ---"
            python3 -m bot.main
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Bot exited normally (session timeout). Restarting..."
              RETRY=$((RETRY+1))
              sleep 10
            else
              echo "Bot crashed with exit code $EXIT_CODE. Restarting in 30s..."
              RETRY=$((RETRY+1))
              sleep 30
            fi
          done
          echo "=== All $MAX_RETRIES attempts exhausted ==="

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/nastya.db
          key: nastya-db-v16-${{ github.run_id }}

      - name: Cleanup
        if: always()
        run: |
          echo "=== Bot session ended ==="
          pkill ollama || true
