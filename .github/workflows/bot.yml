name: Nastya Bot — CLOUD-ONLY v47

# ═══════════════════════════════════════════════════════════════
# Nastya Bot v47.0 — FIX LINKS + WRITE FROM SELF + MORE MODELS!
#
# Architecture:
#   - Pollinations.ai EXPANDED MULTI-MODEL (15 chat models!)
#     - openai (GPT-5.4 Nano) PRIMARY — fast, vision-capable
#     - grok (1.6s), gpt-5.4-mini (1.9s), llama-scout, qwen-vision
#     - mistral, deepseek, mistral-4, gemma, openai-fast — BACKUP
#     - gemini-fast, gpt-5.5, deepseek-pro, gemini, claude-fast — NEW!
#     - Automatic failover on 429/timeout
#   - INLINE MODE — Настя работает в любом чате через @asnastya_bot!
#   - WEB SEARCH — поиск товаров, услуг, лучших цен!
#   - PHOTO SEARCH — фото → распознавание → поиск!
#   - DISCOVERY ENGINE — рецепты, нумерология, астрология, мероприятия!
#   - /find — поиск товаров и лучших цен с ссылками
#   - /horoscope, /recipe, /numerology — новые команды!
#   - AI-POWERED CHANNEL POSTS — развёрнутые посты с ссылками!
#   - REAL PHOTO UNDERSTANDING via Pollinations vision API (6 models!)
#   - URL UNDERSTANDING — Настя читает ссылки!
#   - Group response chance: 50%
#   - News: только русскоязычные источники, авто-новости ТОЛЬКО sochiautoparts.ru
#
# LOCAL MODEL (Qwen3-4B):
#   - DISABLED by default for faster startup
#   - To enable: set ENABLE_LOCAL_MODEL=true in GitHub Secrets
#     AND uncomment the LOCAL MODEL steps below
#
# NO TESTS — bot starts immediately!
#
# Schedule (UTC, Moscow = UTC+3):
#   Every 5 hours: 00:00, 05:00, 10:00, 15:00, 20:00
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 03:00 Moscow
    - cron: '0 5 * * *'      # 05:00 UTC = 08:00 Moscow
    - cron: '0 10 * * *'     # 10:00 UTC = 13:00 Moscow
    - cron: '0 15 * * *'     # 15:00 UTC = 18:00 Moscow
    - cron: '0 20 * * *'     # 20:00 UTC = 23:00 Moscow
  workflow_dispatch:

# ═══ CRITICAL: Single concurrency group ═══
concurrency:
  group: nastya-bot-single
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # ~5h45m

    steps:
      # ── Kill conflicting runs ──
      - name: Cancel conflicting runs and wait
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Checking for other running bot instances ==="
          CURRENT_RUN=${{ github.run_id }}
          REPO=${{ github.repository }}

          for status in in_progress queued; do
            RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?status=$status&per_page=10" \
              | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
              for r in d.get("workflow_runs", []):
                  if r["id"] != int(sys.argv[1]):
                      print(r["id"])
          except: pass
          ' "$CURRENT_RUN")

            for run_id in $RUNS; do
              echo "Cancelling $status run: $run_id"
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel" || true
            done
          done

          echo "Waiting 60s for old bot instances to fully stop..."
          sleep 60
          echo "=== Ready to start ==="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ═══════════════════════════════════════════════════════════
      #  LOCAL MODEL STEPS — COMMENTED OUT (cloud-only mode!)
      #  To enable local model (Qwen3-4B):
      #    1. Set ENABLE_LOCAL_MODEL=true in GitHub Secrets
      #    2. Uncomment all steps below
      #    3. Add MODEL_PATH env to Run step below
      # ═══════════════════════════════════════════════════════════

      # - name: Install llama-cpp-python with AVX2
      #   run: |
      #     echo "=== Installing llama-cpp-python with AVX2 support ==="
      #     CMAKE_ARGS="-DGGML_AVX2=on" pip install llama-cpp-python --force-reinstall --no-cache-dir 2>&1 || {
      #       echo "WARNING: AVX2 build failed, trying without..."
      #       pip install llama-cpp-python --force-reinstall --no-cache-dir
      #     }
      #     python3 -c "from llama_cpp import Llama; print('llama-cpp-python OK!')"
      #     pip install huggingface_hub
      #
      # - name: Cache LOCAL FALLBACK model (Qwen3-4B)
      #   id: cache-model
      #   uses: actions/cache@v4
      #   with:
      #     path: models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      #     key: qwen3-4b-instruct-q4km-v3
      #
      # - name: Download Qwen3-4B-Instruct GGUF model
      #   if: steps.cache-model.outputs.cache-hit != 'true'
      #   run: |
      #     echo "=== Downloading Qwen3-4B-Instruct Q4_K_M model (~2.4GB) — LOCAL FALLBACK ==="
      #     mkdir -p models
      #     python3 -c "
      #     from huggingface_hub import hf_hub_download
      #     path = hf_hub_download(
      #         repo_id='unsloth/Qwen3-4B-Instruct-2507-GGUF',
      #         filename='Qwen3-4B-Instruct-2507-Q4_K_M.gguf',
      #         local_dir='models',
      #     )
      #     print('Downloaded to:', path)
      #     "
      #
      # - name: Verify model
      #   run: |
      #     echo "=== Verifying GGUF model ==="
      #     MODEL_FILE=models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
      #     if [ ! -f "$MODEL_FILE" ] || [ ! -s "$MODEL_FILE" ]; then
      #       echo "WARNING: Model file missing or empty — running in CLOUD-ONLY mode"
      #     else
      #       MODEL_SIZE=$(du -h "$MODEL_FILE" | cut -f1)
      #       echo "OK: Qwen3-4B-Instruct-Q4_K_M (${MODEL_SIZE}) — LOCAL FALLBACK"
      #     fi

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/nastya.db
          key: nastya-db-v47
          restore-keys: |
            nastya-db-

      # ── Run the Bot — UNLIMITED AUTO-RESTART ──
      - name: Run Nastya Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.OWNER_ID }}
          BOT_USERNAME: asnastya_bot
          # Pollinations.ai — MULTI-MODEL PRIMARY + VISION
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          # Local model — disabled by default
          ENABLE_LOCAL_MODEL: ${{ secrets.ENABLE_LOCAL_MODEL }}
          # When enabling local model, uncomment these:
          # MODEL_PATH: models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          # MODEL_N_CTX: 2048
          # MODEL_N_THREADS: 4
          # MODEL_MAX_TOKENS: 256
          # MODEL_HISTORY_LIMIT: 10
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          DB_PATH: data/nastya.db
          LOG_LEVEL: INFO
          NEWS_FETCH_INTERVAL: 900
          CHANNEL_POST_INTERVAL: 1200
        run: |
          echo "=== Starting Nastya Bot v47.0 (FIX LINKS + WRITE FROM SELF + MORE MODELS!) ==="
          echo "PRIMARY: Pollinations.ai EXPANDED 15-MODEL (openai, mistral, gpt-5.4-mini, grok, deepseek, mistral-4, gemma, llama-scout, qwen-vision, openai-fast, gemini-fast, gpt-5.5, deepseek-pro, gemini, claude-fast)"
          echo "INLINE: @asnastya_bot works in any chat!"
          echo "SEARCH: /find — товары и лучшие цены! /search — поиск информации!"
          echo "DISCOVERY: рецепты, нумерология, астрология, мероприятия, скидки!"
          echo "REASONING: Pollinations.ai (openai-large / GPT-5.4)"

          if [ "${ENABLE_LOCAL_MODEL}" = "true" ]; then
            echo "LOCAL FALLBACK: ENABLED — but model steps are commented out in workflow!"
            echo "Uncomment the LOCAL MODEL steps in .github/workflows/bot.yml to use local model."
          else
            echo "LOCAL FALLBACK: DISABLED (cloud-only mode — faster startup)"
            echo "To enable: set ENABLE_LOCAL_MODEL=true in GitHub Secrets AND uncomment model steps in bot.yml"
          fi

          echo "Config: inline=yes, vision=yes(8), search=yes, discovery=yes, ai_news=yes, group_chance=50%, max_tokens=1000(cloud), history=10"
          echo "=== Launching bot with UNLIMITED auto-restart ==="

          # UNLIMITED retries — bot MUST always be running!
          RETRY=0
          while true; do
            RETRY=$((RETRY+1))
            echo "--- Attempt $RETRY ---"

            python3 -m bot.main
            EXIT_CODE=$?
            echo "Bot exited with code $EXIT_CODE (attempt $RETRY)"

            # Intelligent backoff based on exit code
            if [ $EXIT_CODE -eq 2 ]; then
              echo "Persistent conflicts — restarting in 10s..."
              sleep 10
            elif [ $EXIT_CODE -eq 3 ]; then
              echo "Health check failure — restarting in 20s..."
              sleep 20
            elif [ $EXIT_CODE -eq 0 ]; then
              echo "Session timeout — restarting in 5s..."
              sleep 5
            else
              if [ $RETRY -le 3 ]; then
                SLEEP=10
              elif [ $RETRY -le 6 ]; then
                SLEEP=15
              else
                SLEEP=30
              fi
              echo "Bot crashed (code $EXIT_CODE) — restarting in ${SLEEP}s..."
              sleep $SLEEP
            fi
          done

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/nastya.db
          key: nastya-db-v47-${{ github.run_id }}

      # ── Self-dispatch for 24/7 ──
      - name: Re-dispatch workflow for continuous operation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Re-dispatching workflow for 24/7 uptime ==="
          REPO=${{ github.repository }}
          sleep 10
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "Workflow re-dispatched successfully (attempt $i)"
              break
            fi
            echo "Re-dispatch attempt $i failed (HTTP $HTTP_CODE), retrying in 10s..."
            sleep 10
          done
          echo "=== Re-dispatch complete ==="

      - name: Cleanup
        if: always()
        run: |
          echo "=== Bot session ended ==="
