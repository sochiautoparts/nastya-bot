name: Nastya Bot — DUAL-MODEL v38

# ═══════════════════════════════════════════════════════════════
# Nastya Bot v38.0 — QWEN3 PRIMARY + QWEN2.5-3B SECONDARY!
#
# Architecture:
#   - llama-cpp-python as PRIMARY AI provider (GGUF model in-process!)
#   - DUAL-MODEL: Qwen3-4B (PRIMARY) + Qwen2.5-3B (SECONDARY)
#   - /no_think для ОБЕИХ моделей — отключает thinking mode
#   - Автопереключение при ошибках — бот всегда отвечает
#   - AVX2 acceleration — 2-3x faster than Ollama on CPU
#   - Расширенный контекст 4096 токенов, ответы до 512 токенов
#   - 20 сообщений в истории (было 10)
#   - Умное разбиение длинных сообщений по предложениям
#   - Pollinations as FALLBACK (if both models unavailable)
#   - RSS + template commentary for news (NO AI for news!)
#   - Single concurrency group — ONE bot instance only!
#
# Schedule (UTC, Moscow = UTC+3):
#   Every 5 hours: 00:00, 05:00, 10:00, 15:00, 20:00
# ═══════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '0 0 * * *'      # 00:00 UTC = 03:00 Moscow
    - cron: '0 5 * * *'      # 05:00 UTC = 08:00 Moscow
    - cron: '0 10 * * *'     # 10:00 UTC = 13:00 Moscow
    - cron: '0 15 * * *'     # 15:00 UTC = 18:00 Moscow
    - cron: '0 20 * * *'     # 20:00 UTC = 23:00 Moscow
  workflow_dispatch:

# ═══ CRITICAL: Single concurrency group ═══
concurrency:
  group: nastya-bot-single
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345  # ~5h45m

    steps:
      # ── Kill conflicting runs ──
      - name: Cancel conflicting runs and wait
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Checking for other running bot instances ==="
          CURRENT_RUN=${{ github.run_id }}
          REPO=${{ github.repository }}

          for status in in_progress queued; do
            RUNS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/$REPO/actions/runs?status=$status&per_page=10" \
              | python3 -c '
          import sys, json
          try:
              d = json.load(sys.stdin)
              for r in d.get("workflow_runs", []):
                  if r["id"] != int(sys.argv[1]):
                      print(r["id"])
          except: pass
          ' "$CURRENT_RUN")

            for run_id in $RUNS; do
              echo "Cancelling $status run: $run_id"
              curl -s -X POST -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$REPO/actions/runs/$run_id/cancel" || true
            done
          done

          echo "Waiting 60s for old bot instances to fully stop..."
          sleep 60
          echo "=== Ready to start ==="

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Install llama-cpp-python with AVX2 acceleration ──
      - name: Install llama-cpp-python with AVX2
        run: |
          echo "=== Installing llama-cpp-python with AVX2 support ==="
          CMAKE_ARGS="-DGGML_AVX2=on" pip install llama-cpp-python --force-reinstall --no-cache-dir 2>&1 || {
            echo "WARNING: AVX2 build failed, trying without..."
            pip install llama-cpp-python --force-reinstall --no-cache-dir
          }
          python3 -c "from llama_cpp import Llama; print('llama-cpp-python OK!')"

      # ── Download PRIMARY model: Qwen3-4B-Instruct ──
      - name: Cache PRIMARY model (Qwen3-4B)
        id: cache-primary
        uses: actions/cache@v4
        with:
          path: models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          key: qwen3-4b-instruct-q4km-v2

      - name: Download Qwen3-4B-Instruct GGUF model
        if: steps.cache-primary.outputs.cache-hit != 'true'
        run: |
          echo "=== Downloading Qwen3-4B-Instruct Q4_K_M model (~2.4GB) ==="
          mkdir -p models
          python3 -c "
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id='unsloth/Qwen3-4B-Instruct-2507-GGUF',
              filename='Qwen3-4B-Instruct-2507-Q4_K_M.gguf',
              local_dir='models',
          )
          print('Downloaded to:', path)
          "

      # ── Download SECONDARY model: Qwen2.5-3B-Instruct ──
      - name: Cache SECONDARY model (Qwen2.5-3B)
        id: cache-secondary
        uses: actions/cache@v4
        with:
          path: models/Qwen2.5-3B-Instruct-Q4_K_M.gguf
          key: qwen25-3b-instruct-q4km-v1

      - name: Download Qwen2.5-3B-Instruct GGUF model
        if: steps.cache-secondary.outputs.cache-hit != 'true'
        run: |
          echo "=== Downloading Qwen2.5-3B-Instruct Q4_K_M model (~2.0GB) ==="
          mkdir -p models
          python3 -c "
          from huggingface_hub import hf_hub_download
          path = hf_hub_download(
              repo_id='Qwen/Qwen2.5-3B-Instruct-GGUF',
              filename='qwen2.5-3b-instruct-q4_k_m.gguf',
              local_dir='models',
          )
          print('Downloaded to:', path)
          " || {
            echo "WARNING: huggingface_hub download failed, trying wget..."
            wget -q "https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf" \
              -O models/Qwen2.5-3B-Instruct-Q4_K_M.gguf || {
              echo "WARNING: Failed to download SECONDARY model — running with PRIMARY only"
            }
          }
          # Normalize filename (HF hub may download with different case)
          if [ -f "models/qwen2.5-3b-instruct-q4_k_m.gguf" ] && [ ! -f "models/Qwen2.5-3B-Instruct-Q4_K_M.gguf" ]; then
            mv "models/qwen2.5-3b-instruct-q4_k_m.gguf" "models/Qwen2.5-3B-Instruct-Q4_K_M.gguf"
          fi

      - name: Verify models
        run: |
          echo "=== Verifying GGUF models ==="
          for MODEL_FILE in models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf models/Qwen2.5-3B-Instruct-Q4_K_M.gguf; do
            if [ ! -f "$MODEL_FILE" ] || [ ! -s "$MODEL_FILE" ]; then
              echo "WARNING: Model file missing or empty: $MODEL_FILE"
            else
              MODEL_SIZE=$(du -h "$MODEL_FILE" | cut -f1)
              echo "OK: $(basename $MODEL_FILE) (${MODEL_SIZE})"
            fi
          done
          # Quick test with PRIMARY model
          python3 -c "
          from llama_cpp import Llama
          llm = Llama(model_path='models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf', n_ctx=512, n_threads=2, verbose=False)
          resp = llm.create_chat_completion(
              messages=[{'role': 'system', 'content': 'Ты Настя.'}, {'role': 'user', 'content': '/no_think\nПривет, как дела?'}],
              max_tokens=15,
          )
          print('Qwen3 test OK:', resp['choices'][0]['message']['content'][:80])
          "

      - name: Create data directory
        run: mkdir -p data

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/nastya.db
          key: nastya-db-v38
          restore-keys: |
            nastya-db-

      # ── Run the Bot — UNLIMITED AUTO-RESTART ──
      - name: Run Nastya Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          ADMIN_IDS: ${{ secrets.OWNER_ID }}
          BOT_USERNAME: asnastya_bot
          # PRIMARY: Qwen3-4B-Instruct (best Russian, live conversational)
          MODEL_PATH: models/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
          # SECONDARY: Qwen2.5-3B-Instruct (lightweight fast reserve)
          MODEL2_PATH: models/Qwen2.5-3B-Instruct-Q4_K_M.gguf
          # Use qwen3 as primary
          MODEL_PREFERENCE: qwen3
          MODEL_N_CTX: 4096
          MODEL_N_THREADS: 4
          MODEL_MAX_TOKENS: 512
          MODEL_HISTORY_LIMIT: 20
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
          DB_PATH: data/nastya.db
          LOG_LEVEL: INFO
          NEWS_FETCH_INTERVAL: 900
          CHANNEL_POST_INTERVAL: 1200
        run: |
          echo "=== Starting Nastya Bot v38.0 (QWEN3 + QWEN2.5-3B) ==="
          echo "Primary: Qwen3-4B-Instruct-Q4_K_M"
          echo "Secondary: Qwen2.5-3B-Instruct-Q4_K_M"
          echo "Context: 4096 tokens, Max output: 512 tokens, History: 20 messages"
          ls -lh models/*.gguf 2>/dev/null || echo "WARNING: No GGUF models found!"
          echo "=== Launching bot with UNLIMITED auto-restart ==="

          # UNLIMITED retries — bot MUST always be running!
          RETRY=0
          while true; do
            RETRY=$((RETRY+1))
            echo "--- Attempt $RETRY ---"

            python3 -m bot.main
            EXIT_CODE=$?
            echo "Bot exited with code $EXIT_CODE (attempt $RETRY)"

            # Intelligent backoff based on exit code
            if [ $EXIT_CODE -eq 2 ]; then
              echo "Persistent conflicts — restarting in 10s..."
              sleep 10
            elif [ $EXIT_CODE -eq 3 ]; then
              echo "Health check failure — restarting in 20s..."
              sleep 20
            elif [ $EXIT_CODE -eq 0 ]; then
              echo "Session timeout — restarting in 5s..."
              sleep 5
            else
              if [ $RETRY -le 3 ]; then
                SLEEP=10
              elif [ $RETRY -le 6 ]; then
                SLEEP=15
              else
                SLEEP=30
              fi
              echo "Bot crashed (code $EXIT_CODE) — restarting in ${SLEEP}s..."
              sleep $SLEEP
            fi
          done

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/nastya.db
          key: nastya-db-v38-${{ github.run_id }}

      # ── Self-dispatch for 24/7 ──
      - name: Re-dispatch workflow for continuous operation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: |
          echo "=== Re-dispatching workflow for 24/7 uptime ==="
          REPO=${{ github.repository }}
          sleep 10
          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/bot.yml/dispatches" \
              -d '{"ref":"main"}')
            if [ "$HTTP_CODE" = "204" ]; then
              echo "Workflow re-dispatched successfully (attempt $i)"
              break
            fi
            echo "Re-dispatch attempt $i failed (HTTP $HTTP_CODE), retrying in 10s..."
            sleep 10
          done
          echo "=== Re-dispatch complete ==="

      - name: Cleanup
        if: always()
        run: |
          echo "=== Bot session ended ==="
